<!-- SignBridge privacy consent: integrate into registration form -->
<fieldset class="privacy-consent">
  <legend>Privacy & consent</legend>
  <p><strong>Your privacy matters.</strong> SignBridge is designed to minimise personal information. Camera input is permission-based and raw camera footage is not retained by default. Your conversations are not used to train the SignBridge AI by default.</p>
  <label>
    <input type="checkbox" name="privacy_consent" required>
    I have read the <a href="privacy.html" target="_blank" rel="noopener">SignBridge Privacy Notice</a>
    and consent to the processing of my information for the service I request.
  </label>
  <label>
    <input type="checkbox" name="ai_training_consent">
    I understand that my conversations and camera footage are not automatically used to train the AI.
  </label>
  <label>
    <input type="checkbox" name="marketing_consent">
    I agree to optional SignBridge updates. (Optional)
  </label>
</fieldset>
